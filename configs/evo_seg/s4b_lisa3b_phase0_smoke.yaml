# Phase-0 smoke: mixed + epoch_cycle + grad_accum on 3B, tiny step budget.
seed: 0

head: lisa

task: mixed

training:
  steps: 6
  lr: 2.0e-4
  lora_lr: 4.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 2
  eval_every: 500
  save_every: 2
  hidden_layer: -1
  sam2_mask_decoder_trainable: true
  refined_mask_weight: 0.0
  fixed_subset: 0
  mix_video_ratio: 0.25
  no_object_ratio: 0.25
  swap_prob: 0.3
  swap_margin: 0.1
  epoch_cycle: true
  grad_accum: 2

lora:
  rank: 16
  alpha: 32
  layers: 32
  projections:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj

loss_weights:
  bce: 1.0
  dice: 1.0
  objectness: 0.2
  query_swap: 0.3
  bce_positive_weight: 5.0

sam2:
  model_config: configs/sam2.1/sam2.1_hiera_t.yaml
  apply_postprocessing: true

decoder:
  feature_dim: 256

prompt:
  instruction_template: "Segment the object described by this referring expression:\n{query}"

retention_probes:
  image_paths: []
  video_dir: null
