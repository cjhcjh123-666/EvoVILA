# S4b v2 3B (架构 v2, 对标 LISA/Sa2VA 配方升级):
#   - SAM2.1-hiera-large (最高官方档) mask decoder 可训练
#   - 强 LoRA: rank 64 / alpha 128 / 全部 32 层 / q,k,v,o + mlp 7 个投影
#   - 视觉塔(SigLIP) LoRA: rank 16 (可关)
#   - 数据: RefCOCO/+/g 图像 + Ref-YT-VOS + MeViS v2 视频 (epoch-cycle 全覆盖)
#   - 门控全量微调: 打开 lora.full_rank: true 即 rank=hidden (seg 作用域内全量 delta,
#     基座 VILA 仍零损伤; 每卡额外约 13GB)。默认先 rank64。
#   - anti-shortcut (no-object + query-swap) 保留; grad_accum=2
seed: 0

head: lisa

task: mixed

training:
  steps: 40000
  lr: 2.0e-4
  lora_lr: 4.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 100
  eval_every: 1000
  save_every: 1000
  hidden_layer: -1
  sam2_mask_decoder_trainable: true
  refined_mask_weight: 0.0
  fixed_subset: 0
  mix_video_ratio: 0.30
  no_object_ratio: 0.25
  swap_prob: 0.3
  swap_margin: 0.1
  epoch_cycle: true
  grad_accum: 2
  # 视频 memory 训练 (第5项): 逐帧时序解码 + SAM2 memory attention 端到端。
  # 需 GPU smoke 验证后再开; 开启时解冻 memory_encoder + memory_attention (约7.3M 参数)。
  sam2_memory_trainable: false
  video_memory: false

lora:
  rank: 64
  alpha: 128
  layers: 32
  projections:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
  vision_lora: true
  vision_rank: 16
  vision_alpha: 32
  # full_rank: true   # 门控全量微调 (rank=hidden), 内存每卡约 +13GB

loss_weights:
  bce: 1.0
  dice: 1.0
  objectness: 0.2
  query_swap: 0.3
  bce_positive_weight: 5.0

sam2:
  model_config: configs/sam2.1/sam2.1_hiera_l.yaml
  apply_postprocessing: true

decoder:
  feature_dim: 256

prompt:
  instruction_template: "Segment the object described by this referring expression:\n{query}"

retention_probes:
  image_paths: []
  video_dir: null
